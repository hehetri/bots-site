<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06131f">
  <meta name="description" content="BOTS Online — Small bots, big adventure.">
  <title>BOTS Online</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="mockup-site" aria-label="BOTS Online website">
    <div class="design-stage">
      <img class="design-image"
        src="./ChatGPT%20Image%20Sep%2022,%202026%20at%2006_10_56%20PM.png"
        alt="BOTS Online website design">

      <header class="hotspot header-hotspot">
        <a href="#home" class="hotspot-link home" aria-label="Home"></a>
        <a href="#game-info" class="hotspot-link game-info" aria-label="Game Info"></a>
        <a href="#download" class="hotspot-link download" aria-label="Download"></a>
        <a href="#ranking" class="hotspot-link ranking" aria-label="Ranking"></a>
        <a href="#community" class="hotspot-link community" aria-label="Community"></a>
        <a href="#support" class="hotspot-link support" aria-label="Support"></a>
        <button class="hotspot-link language" type="button" aria-label="Select language"></button>
      </header>

      <a href="#download" class="hotspot-link play-now" aria-label="Play Now — Download Game Client"></a>

      <section id="home" class="hotspot hero-area" aria-label="BOTS Online home"></section>

      <section id="news" class="hotspot news-area" aria-label="News and Updates">
        <a href="#news" class="hotspot-link view-news" aria-label="View all news"></a>
      </section>

      <section id="game-info" class="hotspot game-info-area" aria-label="Game Information">
        <a href="#game-guide" class="hotspot-link game-guide" aria-label="Game Guide"></a>
        <a href="#characters" class="hotspot-link characters" aria-label="Characters"></a>
        <a href="#maps" class="hotspot-link maps" aria-label="Maps"></a>
        <a href="#items" class="hotspot-link items" aria-label="Items"></a>
      </section>

      <aside id="download" class="hotspot side-area" aria-label="Download and site links">
        <a href="#download-client" class="hotspot-link download-client" aria-label="Download Game Client"></a>
        <a href="#game-guide" class="hotspot-link side-guide" aria-label="Game Guide"></a>
        <a href="#ranking" class="hotspot-link side-ranking" aria-label="Ranking"></a>
        <a href="#community" class="hotspot-link side-community" aria-label="Community"></a>
        <a href="#support" class="hotspot-link side-support" aria-label="Support"></a>
      </aside>

      <footer class="hotspot footer-area" aria-label="Footer">
        <a href="#home" class="hotspot-link footer-home" aria-label="Home"></a>
        <a href="#game-info" class="hotspot-link footer-game-info" aria-label="Game Info"></a>
        <a href="#download" class="hotspot-link footer-download" aria-label="Download"></a>
        <a href="#ranking" class="hotspot-link footer-ranking" aria-label="Ranking"></a>
        <a href="#community" class="hotspot-link footer-community" aria-label="Community"></a>
        <a href="#support" class="hotspot-link footer-support" aria-label="Support"></a>
      </footer>
    </div>
  </main>
  <script src="./js/main.js"></script>
</body>
</html>
